# TLS termination for the landing — mycard24.ru and www.
#
# The site is prerendered: every route is a real HTML file in the image, so there is no SPA fallback
# here. A genuine miss gets dist/404.html, which is a designed page rather than nginx's default.
#
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/, then
# `nginx -t && systemctl reload nginx`.

upstream mycard24_web_landing {
    # Matches LANDING_PORT in /opt/mycard24-web-landing/.env.
    server 127.0.0.1:8087;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mycard24.ru www.mycard24.ru;

    return 301 https://mycard24.ru$request_uri;
}

# www → apex, so the canonical host in sitemap.xml and the JSON-LD is the one people land on.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mycard24.ru;

    ssl_certificate     /etc/ssl/mycard24.ru.pem;
    ssl_certificate_key /etc/ssl/mycard24.ru.key;

    return 301 https://mycard24.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mycard24.ru;

    # A single wildcard for *.mycard24.ru, issued with acme.sh over the Cloudflare DNS API. One
    # certificate covers every subdomain, so a new vhost needs no new certificate.
    ssl_certificate     /etc/ssl/mycard24.ru.pem;
    ssl_certificate_key /etc/ssl/mycard24.ru.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # No ssl_stapling: Let's Encrypt stopped publishing an OCSP responder URL in its certificates,
    # so nginx ignores the directive and warns about it on every reload. Dead config that costs a
    # line of noise each time somebody checks the server.

    # Only once HTTPS is known good — browsers honour max-age even if the certificate later breaks.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    # Fingerprinted by Vite, so the name changes whenever the content does.
    location /assets/ {
        proxy_pass http://mycard24_web_landing;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        # static-web-server sends its own Cache-Control; hide it or the directive goes out twice.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://mycard24_web_landing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # HTML must revalidate: a prerendered page that changed should not sit in a cache, and the
        # pages are what the search engines re-read.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        proxy_intercept_errors on;
        error_page 404 = @notfound;
        error_page 502 503 504 = @unavailable;
    }

    # The site ships its own 404 page; serve that rather than nginx's.
    location @notfound {
        rewrite ^ /404.html break;
        proxy_pass http://mycard24_web_landing;
        proxy_set_header Host $host;
    }

    location @unavailable {
        default_type text/html;
        return 503 "<!doctype html><meta charset=utf-8><title>МояКарта24</title><body style=\"font-family:system-ui;margin:4rem auto;max-width:32rem;line-height:1.6\"><h1>Сайт временно недоступен</h1><p>Мы уже чиним. Попробуйте позже.</p></body>";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;
}

# Сборка и публикация лендинга на GitHub Pages.
#
# Деплоится ветка production. Домен — mycard24.ru, он же лежит в public/CNAME
# и попадает в dist при сборке: без этого файла Pages сбрасывает привязку домена
# на каждом деплое.
name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют между собой; лишние прогоны отменяем,
# но уже идущую публикацию не трогаем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Типы проверяем до сборки: в прод не должен уезжать код, который
      # не проходит tsc
      - run: npm run typecheck

      # vite build + серверная сборка + пререндер всех страниц в dist/
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
